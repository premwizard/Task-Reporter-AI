name: Advanced CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Concurrency to cancel in-progress runs if new commits are pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          
      - name: Frontend Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Backend Audit
        working-directory: backend
        run: npm audit --audit-level=high

  frontend-ci:
    name: Frontend Build & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: security-audit
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 5

  backend-ci:
    name: Backend Startup & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: security-audit
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Validate Server Startup
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_db
          PORT: 5000
          SESSION_SECRET: ci_secret
          JWT_SECRET: ci_secret
          GITHUB_APP_ID: 123456
          GITHUB_PRIVATE_KEY: "ci_mock_key"
        run: |
          echo "Validating backend startup..."
          # Start the server in the background and check if it stays up
          npm start &
          SERVER_PID=$!
          sleep 5
          if ps -p $SERVER_PID > /dev/null
          then
             echo "Backend server started successfully and is running."
             kill $SERVER_PID
          else
             echo "Backend server failed to start or crashed."
             exit 1
          fi
