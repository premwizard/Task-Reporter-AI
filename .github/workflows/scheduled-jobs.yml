name: Scheduled Cron Jobs

on:
  schedule:
    # 1. Daily database backup at midnight UTC
    - cron: '0 0 * * *'
    
    # 2. Hourly health monitoring of the backend
    - cron: '0 * * * *'
    
    # 3. Report generation verification at 5:55 PM IST (12:25 PM UTC)
    - cron: '25 12 * * *'

jobs:
  daily-backup:
    name: Daily Database Backup
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * *'
    steps:
      - name: Trigger Backup Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.BACKEND_HEALTH_URL }}/api/cron/backup" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Database backup failed with status $HTTP_STATUS"
            exit 1
          fi

  health-monitor:
    name: Hourly Health Monitor
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 * * * *'
    steps:
      - name: Ping Health Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_HEALTH_URL }}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health monitor failed with status $HTTP_STATUS"
            exit 1
          fi

  report-verification:
    name: Verify Daily Reports
    runs-on: ubuntu-latest
    if: github.event.schedule == '25 12 * * *'
    steps:
      - name: Trigger Report Verification
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.BACKEND_HEALTH_URL }}/api/cron/verify-reports" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Report verification failed with status $HTTP_STATUS"
            exit 1
          fi
